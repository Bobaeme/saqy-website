<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Saqy Fly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background: var(--grey-50);
    }
    .error-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2rem;
      max-width: 500px;
      box-shadow: var(--shadow);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--ocean);
      line-height: 1;
      opacity: .2;
    }
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230077b6'/><text x='5' y='23' font-size='18' font-weight='900' fill='%23fff'>SF</text></svg>" />
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <div style="font-size:2.5rem; margin-bottom:.5rem;">🌾</div>
    <h2>Page Not Found</h2>
    <p style="margin: .75rem 0 1.75rem; color: var(--text-muted);">
      The page you requested could not be located.
    </p>
    <div style="display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap;">
      <a href="/" class="btn btn-primary">Return Home</a>
      <a href="/services/" class="btn btn-outline">Our Services</a>
      <a href="/contact/" class="btn btn-outline">Contact Us</a>
    </div>
  </div>
</body>
</html>
