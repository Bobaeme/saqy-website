<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Saqy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .error-page { padding: 2rem; }
    .error-page__code { font-size: 7rem; font-weight: 800; color: var(--accent); line-height: 1; opacity: .15; }
    .error-page__icon { font-size: 3rem; margin-bottom: 1rem; }
    .error-page h1 { margin-bottom: .75rem; }
    .error-page p { margin-bottom: 2rem; }
    .error-page__actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2300c853'/><text x='6' y='24' font-size='20' font-weight='900' fill='%23000'>S</text></svg>" />
</head>
<body>
  <div class="error-page">
    <div class="error-page__code">404</div>
    <div class="error-page__icon">🌾</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist, or may have moved. Let's get you back on track.</p>
    <div class="error-page__actions">
      <a href="/" class="btn btn-primary">Go Home</a>
      <a href="/services/" class="btn btn-outline">View Services</a>
      <a href="/#contact" class="btn btn-outline">Contact Us</a>
    </div>
  </div>
</body>
</html>
